<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>media_index</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#262c36; --ink:#e6edf3;
    --dim:#8b949e; --accent:#4c8dff; --ok:#3fb950; --warn:#d29922;
    --bad:#f85149; --filler:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;
       min-height:100vh}
  aside{width:210px;flex:0 0 210px;background:var(--panel);
        border-right:1px solid var(--line);padding:18px 0;position:sticky;
        top:0;height:100vh}
  aside h1{font-size:15px;margin:0 18px 18px;letter-spacing:.5px}
  aside h1 span{color:var(--dim);font-weight:400}
  nav a{display:block;padding:9px 18px;color:var(--dim);text-decoration:none;
        border-left:3px solid transparent;cursor:pointer}
  nav a:hover{color:var(--ink);background:#1c222b}
  nav a.on{color:var(--ink);border-left-color:var(--accent);background:#1c222b}
  main{flex:1;padding:24px 28px;max-width:1400px}
  h2{margin:0 0 4px;font-size:20px}
  .sub{color:var(--dim);margin:0 0 20px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=text]{flex:1;min-width:280px;background:#0b0f14;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:9px 11px;
    font:13px/1.4 ui-monospace,Consolas,monospace}
  button{background:var(--accent);color:#fff;border:0;border-radius:6px;
    padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
  button.ghost{background:#21262d;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:12px 16px;min-width:110px}
  .card b{display:block;font-size:22px;font-weight:600}
  .card span{color:var(--dim);font-size:12px}
  .scene{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    margin-bottom:12px;overflow:hidden}
  .scene > header{display:flex;gap:12px;padding:11px 14px;cursor:pointer;
    align-items:baseline}
  .scene > header:hover{background:#1c222b}
  .no{color:var(--dim);font:12px ui-monospace,Consolas,monospace;flex:0 0 42px}
  .narr{flex:1;color:var(--ink)}
  .when{color:var(--dim);font:12px ui-monospace,Consolas,monospace}
  .strip{display:flex;gap:8px;padding:0 14px 14px;overflow-x:auto}
  .shot{flex:0 0 168px;border:1px solid var(--line);border-radius:6px;
    overflow:hidden;background:#0b0f14;cursor:pointer}
  .shot.sel{border-color:var(--accent)}
  .shot img,.shot video{display:block;width:100%;height:94px;object-fit:cover;
    background:#000}
  .meta{padding:6px 8px;font-size:11px;color:var(--dim);
        font-family:ui-monospace,Consolas,monospace}
  .tag{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;
    font-weight:700;letter-spacing:.3px;text-transform:uppercase}
  .anchor{background:#12331d;color:var(--ok)}
  .verified{background:#122a33;color:#39c5cf}
  .interpolated{background:#33290f;color:var(--warn)}
  .filler{background:#2a1a3d;color:var(--filler)}
  .unknown{background:#2a2f37;color:var(--dim)}
  .empty{padding:0 14px 14px;color:var(--warn);font-size:13px}
  .panelbox{background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:16px;margin-bottom:16px}
  .panelbox h3{margin:0 0 10px;font-size:14px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  td{padding:5px 8px;border-bottom:1px solid var(--line)}
  td:first-child{color:var(--dim);width:190px}
  .err{color:var(--bad)}
  .hint{color:var(--dim);font-size:13px}
  video.big{width:100%;max-height:420px;background:#000;border-radius:6px}
  code{background:#0b0f14;border:1px solid var(--line);border-radius:4px;
       padding:1px 6px;font-family:ui-monospace,Consolas,monospace}
  ol.steps li{margin-bottom:8px}
</style>
</head>
<body>
<aside>
  <h1>media_<span>index</span></h1>
  <nav>
    <a data-page="timeline" class="on">Timeline</a>
    <a data-page="library">Library</a>
    <a data-page="build">Build</a>
    <a data-page="render">Render</a>
  </nav>
</aside>
<main id="main"></main>

<script>
const $ = (s, r) => (r || document).querySelector(s);
const state = {page: "timeline", build: null, out: "", sel: null};

function fmt(t){
  if (t === null || t === undefined) return "--";
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

async function get(url){
  const r = await fetch(url);
  const j = await r.json().catch(() => ({error: "the server sent nothing"}));
  if (!r.ok && !j.error) j.error = "request failed (" + r.status + ")";
  return j;
}

/* ---------------------------------------------------------------- pages */

function timelinePage(){
  const b = state.build;
  let html = `
    <h2>Timeline</h2>
    <p class="sub">Every shot in the finished video, in order, with where it
      came from and why it is there.</p>
    <div class="row">
      <input type="text" id="out" placeholder="D:\\OF16"
             value="${esc(state.out)}">
      <button id="load">Open</button>
    </div>`;

  if (b && b.error) html += `<p class="err">${esc(b.error)}</p>`;

  if (b && !b.error){
    const c = b.counts || {};
    const total = Object.values(c).reduce((a, x) => a + x, 0);
    html += `<div class="cards">
      <div class="card"><b>${fmt(b.total_seconds)}</b><span>length</span></div>
      <div class="card"><b>${b.scenes.length}</b><span>scenes</span></div>
      <div class="card"><b>${total}</b><span>shots</span></div>
      ${["anchor","verified","interpolated","filler"].filter(k => c[k]).map(k =>
        `<div class="card"><b>${c[k]}</b><span class="tag ${k}">${k}</span></div>`
      ).join("")}
      ${b.empty ? `<div class="card"><b>${b.empty}</b><span>with nothing</span></div>` : ""}
    </div>`;

    if (b.rendered){
      html += `<div class="panelbox"><h3>The finished video</h3>
        <video class="big" controls preload="metadata" src="${b.rendered}"></video></div>`;
    }

    html += b.scenes.map(s => `
      <section class="scene" data-scene="${s.scene}">
        <header>
          <span class="no">${String(s.scene).padStart(3, "0")}</span>
          <span class="narr">${esc(s.narration).slice(0, 220) || "<i>no narration</i>"}</span>
          <span class="when">${fmt(s.start)}&ndash;${fmt(s.end)}</span>
        </header>
        ${s.items.length ? `<div class="strip">${s.items.map(i => shotHTML(s, i)).join("")}</div>`
                         : `<div class="empty">nothing to show here${s.note ? " &mdash; " + esc(s.note) : ""}</div>`}
      </section>`).join("");
  } else if (b === null){
    html += `<p class="hint">Give it an output folder &mdash; the one you
      passed to step 9, T and R.</p>`;
  }
  return html;
}

function shotHTML(s, i){
  const at = i.source_start == null ? "" : fmt(i.source_start);
  const tag = i.placed_by || "unknown";
  const media = i.kind === "video"
    ? `<video src="${i.url}#t=0.5" preload="metadata" muted></video>`
    : `<img src="${i.url}" loading="lazy" alt="">`;
  return `<div class="shot" data-scene="${s.scene}" data-file="${esc(i.file)}">
      ${media}
      <div class="meta">
        <span class="tag ${tag}">${tag}</span> ${i.duration.toFixed(1)}s<br>
        ${esc((i.source || "").replace(/\.[^.]+$/, "").slice(-22))} @ ${at}
      </div>
    </div>`;
}

function libraryPage(lib){
  if (!lib) return `<h2>Library</h2><p class="sub">Reading&hellip;</p>`;
  if (lib.error) return `<h2>Library</h2><p class="err">${esc(lib.error)}</p>`;
  const rows = Object.entries(lib)
    .filter(([k, v]) => !Array.isArray(v))
    .map(([k, v]) => `<tr><td>${esc(k.replace(/_/g, " "))}</td><td>${esc(v)}</td></tr>`)
    .join("");
  const titles = (lib.titles || []).map(t => `<tr>
      <td>${esc(t.show)}</td>
      <td>${esc(t.files)} file(s) &middot; ${esc(t.lines || 0)} line(s)${
        t.s_min ? " &middot; seasons " + esc(t.s_min) + "&ndash;" + esc(t.s_max) : ""}</td>
    </tr>`).join("");
  return `<h2>Library</h2>
    <p class="sub">What the tool has indexed and can cut from.</p>
    <div class="panelbox"><table>${rows}</table></div>
    ${titles ? `<div class="panelbox"><h3>Titles</h3><table>${titles}</table></div>` : ""}`;
}

function buildPage(){
  return `<h2>Build</h2>
    <p class="sub">Turning a visual script into clips and stills.</p>
    <div class="panelbox">
      <h3>Still done from the menu</h3>
      <p class="hint">This page shows the result; it does not start the work
        yet. In the terminal window:</p>
      <ol class="steps hint">
        <li><code>9</code> &mdash; the script, then a NEW output folder</li>
        <li><code>T</code> &mdash; that folder, the script, the narration mp3</li>
        <li><code>R</code> &mdash; that folder</li>
      </ol>
      <p class="hint">Then open the folder on the Timeline page.</p>
    </div>`;
}

function renderPage(){
  const b = state.build;
  if (!b || b.error) return `<h2>Render</h2>
    <p class="sub">Open a folder on the Timeline page first.</p>`;
  return `<h2>Render</h2>
    <p class="sub">${esc(b.out)}</p>
    <div class="panelbox">
      <table>
        <tr><td>planned length</td><td>${fmt(b.total_seconds)}</td></tr>
        <tr><td>pace</td><td>${esc(b.pace || "--")}</td></tr>
        <tr><td>narration</td><td>${esc(b.audio || "--")}</td></tr>
        <tr><td>rendered file</td><td>${b.rendered ? "video.mp4" : "not rendered yet"}</td></tr>
      </table>
    </div>
    ${b.rendered ? `<div class="panelbox"><h3>video.mp4</h3>
      <video class="big" controls preload="metadata" src="${b.rendered}"></video>
    </div>` : `<p class="hint">Run <code>R</code> in the terminal to make it.</p>`}`;
}

/* --------------------------------------------------------------- wiring */

async function draw(){
  const main = $("#main");
  if (state.page === "timeline"){
    main.innerHTML = timelinePage();
    $("#load").onclick = load;
    $("#out").onkeydown = e => { if (e.key === "Enter") load(); };
    main.querySelectorAll(".shot").forEach(el => {
      el.onclick = () => {
        main.querySelectorAll(".shot").forEach(x => x.classList.remove("sel"));
        el.classList.add("sel");
      };
    });
    main.querySelectorAll(".scene > header").forEach(h => {
      h.onclick = () => {
        const strip = h.nextElementSibling;
        if (strip) strip.style.display = strip.style.display === "none" ? "" : "none";
      };
    });
  } else if (state.page === "library"){
    main.innerHTML = libraryPage(null);
    main.innerHTML = libraryPage(await get("/api/library"));
  } else if (state.page === "build"){
    main.innerHTML = buildPage();
  } else {
    main.innerHTML = renderPage();
  }
}

async function load(){
  const out = $("#out").value.trim();
  if (!out) return;
  state.out = out;
  localStorage.setItem("mi_out", out);
  $("#load").disabled = true;
  state.build = await get("/api/build?out=" + encodeURIComponent(out));
  $("#load").disabled = false;
  draw();
}

document.querySelectorAll("nav a").forEach(a => {
  a.onclick = () => {
    document.querySelectorAll("nav a").forEach(x => x.classList.remove("on"));
    a.classList.add("on");
    state.page = a.dataset.page;
    draw();
  };
});

(async function start(){
  const info = await get("/api/start");
  state.out = localStorage.getItem("mi_out") || info.out || "";
  await draw();
  if (state.out) load();
})();
</script>
</body>
</html>
